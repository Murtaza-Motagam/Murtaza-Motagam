
<svg viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="'JetBrains Mono','Fira Code',ui-monospace,'Courier New',monospace">
  <defs>
    <!-- background gradient -->
    <radialGradient id="glowA" cx="15%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#2ee6a6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2ee6a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="92%" cy="95%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ee6a6"/>
      <stop offset="55%" stop-color="#5ad1ff"/>
      <stop offset="100%" stop-color="#9d8bff"/>
    </linearGradient>
    <linearGradient id="winStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ee6a6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1100" height="360" rx="20" fill="#0a0e14"/>
  <rect width="1100" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1100" height="360" rx="20" fill="url(#glowA)"/>
  <rect width="1100" height="360" rx="20" fill="url(#glowB)"/>

  <!-- window -->
  <g filter="url(#soft)">
    <rect x="40" y="40" width="1020" height="280" rx="16" fill="#0d1117"/>
    <rect x="40.5" y="40.5" width="1019" height="279" rx="15.5" stroke="url(#winStroke)" stroke-width="1"/>
  </g>

  <!-- title bar -->
  <circle cx="74" cy="62" r="6" fill="#ff5f56"/>
  <circle cx="96" cy="62" r="6" fill="#ffbd2e"/>
  <circle cx="118" cy="62" r="6" fill="#27c93f"/>
  <rect x="150" y="48" width="190" height="28" rx="7" fill="#161b22"/>
  <circle cx="170" cy="62" r="4" fill="#2ee6a6"/>
  <text x="186" y="67" font-size="13" fill="#c9d1d9">profile.ts</text>
  <text x="1030" y="67" font-size="14" fill="#8b949e" text-anchor="end">⌘</text>
  <line x1="40" y1="88" x2="1060" y2="88" stroke="#21262d" stroke-width="1"/>

  <!-- ===== LEFT PANEL ===== -->
  <text x="80" y="138" font-size="15" fill="#2ee6a6">$ whoami</text>

  <text x="78" y="200" font-size="50" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">Murtaza Motagam</text>

  <text x="80" y="236" font-size="19" fill="#c9d1d9">&lt;Software Engineer /&gt; <tspan fill="#8b949e">@ Refrens</tspan></text>

  <!-- tech chips -->
  <g font-size="12.5">
    <rect x="80"  y="258" width="64"  height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="112" y="275" fill="#61dafb" text-anchor="middle">React</text>

    <rect x="152" y="258" width="74"  height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="189" y="275" fill="#ffffff" text-anchor="middle">Next.js</text>

    <rect x="234" y="258" width="92"  height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="280" y="275" fill="#3178c6" text-anchor="middle">TypeScript</text>

    <rect x="334" y="258" width="118" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="393" y="275" fill="#61dafb" text-anchor="middle">React Native</text>
  </g>

  <!-- panel divider -->
  <line x1="560" y1="112" x2="560" y2="296" stroke="#21262d" stroke-width="1"/>

  <!-- ===== RIGHT PANEL: code ===== -->
  <g font-size="15.5">
    <!-- line numbers -->
    <g fill="#484f58" text-anchor="end">
      <text x="612" y="138">1</text>
      <text x="612" y="164">2</text>
      <text x="612" y="190">3</text>
      <text x="612" y="216">4</text>
      <text x="612" y="242">5</text>
      <text x="612" y="268">6</text>
      <text x="612" y="294">7</text>
    </g>
    <!-- code -->
    <text x="636" y="138"><tspan fill="#ff7b72">const</tspan><tspan fill="#c9d1d9"> dev </tspan><tspan fill="#ff7b72">=</tspan><tspan fill="#c9d1d9"> {</tspan></text>
    <text x="636" y="164"><tspan fill="#79c0ff">  focus</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">'UI/UX · Perf · a11y'</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="636" y="190"><tspan fill="#79c0ff">  stack</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">'React'</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">'Next'</tspan><tspan fill="#c9d1d9">],</tspan></text>
    <text x="636" y="216"><tspan fill="#79c0ff">  backend</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">'FeathersJS'</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="636" y="242"><tspan fill="#c9d1d9">             </tspan><tspan fill="#a5d6ff">'MongoDB'</tspan><tspan fill="#c9d1d9">],</tspan></text>
    <text x="636" y="268"><tspan fill="#79c0ff">  shipping</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#79c0ff">true</tspan><tspan fill="#c9d1d9">,  </tspan><tspan fill="#8b949e">// ⚡</tspan></text>
    <text x="636" y="294"><tspan fill="#c9d1d9">}</tspan><tspan fill="#2ee6a6">▌</tspan>
      <animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.5;0.75;1" dur="1.1s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
